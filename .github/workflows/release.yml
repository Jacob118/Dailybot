name: Build and release DailyBot

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: x64

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build DailyBot.exe
        run: python -m PyInstaller --noconfirm --clean --onedir --noconsole --name DailyBot --distpath dist-portable --workpath build-portable --add-data "web;web" app.py

      - name: Package Windows app
        run: Compress-Archive -Path dist-portable/DailyBot -DestinationPath dist-portable/DailyBot-windows-x64.zip -CompressionLevel Optimal -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-portable/DailyBot-windows-x64.zip
          generate_release_notes: true
